PROJECT_ROOT="/path/to/project" # Update to the desired output directory
STARSOLO_OUTDIR="${PROJECT_ROOT}/results/starsolo"
VELOCYTO_OUTDIR="${PROJECT_ROOT}/results/velocyto"
DOWNSTREAM_OUTDIR="${PROJECT_ROOT}/results/scdownstream"
CELLASSIGN_OUTDIR="${PROJECT_ROOT}/results/cellassign"

WORK_DIR="${PROJECT_ROOT}/work"                     # read by Nextflow as the work dir
CACHE_DIR="/scratch/$USER/cache"
NXF_SINGULARITY_CACHEDIR="${CACHE_DIR}/singularity_cache"
APPTAINER_CACHEDIR="${CACHE_DIR}/apptainer_cache"
NXF_HOME="${CACHE_DIR}/nextflow"
CONTAINER_DIR="${CACHE_DIR}/containers" # setup.sh builds the pipeline's own images (containers/) here
SBATCH_ACCOUNT="ag-beyer" # Update to match the correct Slurm account

PROTOCOL="10XV3" # The scRNA-seq method used, needed to make STAR use the correct barcode whitelist
FASTA_PATH="/path/to/fasta" # Path to the FASTA file used to generate the STAR index
GTF_PATH="/path/to/gtf" # Path to the GTF file used to generate the STAR index
STAR_INDEX_PATH="/path/to/star/index/" # Path to the star index

RUN_VELOCYTO="false" # Set to "true" to also make spliced/unspliced matrices with STARsolo Velocyto (realigns all samples)
MARKER_GENES="" # Marker gene YAML for CellAssign cell type assignment, such as "marker_gene_sets/mouse_glomerulus.yaml"; leave empty to skip
